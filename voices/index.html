<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PalChat voice samples</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --card: #ffffff;
      --text: #2c2a28;
      --muted: #6b6560;
      --accent: #5a7a6a;
      --border: #e8e4df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3.5rem;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
    }
    .intro {
      color: var(--muted);
      margin: 0 0 2rem;
      font-size: 0.98rem;
    }
    .intro a { color: var(--accent); }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.35rem 1.1rem;
      margin-bottom: 1.25rem;
    }
    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 1rem;
      color: var(--accent);
    }
    .sample {
      margin-bottom: 1rem;
    }
    .sample:last-child { margin-bottom: 0; }
    .sample label {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 0.35rem;
      color: var(--text);
    }
    audio {
      width: 100%;
      height: 36px;
    }
    .note {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <h1>PalChat voice samples</h1>
    <p class="intro">
      Listen below and pick 1–3 favorites. On the free plan, Gentle guide and Bright voice need a paid plan.
      Questions? <a href="mailto:mypalcommunications@gmail.com">mypalcommunications@gmail.com</a>
    </p>

    <section>
      <h2>Warm friend</h2>
      <div class="sample">
        <label for="wf-more">I want more</label>
        <audio id="wf-more" controls preload="metadata" src="warm-friend_i-want-more.mp3"></audio>
      </div>
      <div class="sample">
        <label for="wf-help">Can I have help</label>
        <audio id="wf-help" controls preload="metadata" src="warm-friend_can-i-have-help.mp3"></audio>
      </div>
      <div class="sample">
        <label for="wf-done">I am all done</label>
        <audio id="wf-done" controls preload="metadata" src="warm-friend_i-am-all-done.mp3"></audio>
      </div>
    </section>

    <section>
      <h2>Matilda</h2>
      <div class="sample">
        <label for="m-more">I want more</label>
        <audio id="m-more" controls preload="metadata" src="matilda_i-want-more.mp3"></audio>
      </div>
      <div class="sample">
        <label for="m-help">Can I have help</label>
        <audio id="m-help" controls preload="metadata" src="matilda_can-i-have-help.mp3"></audio>
      </div>
      <div class="sample">
        <label for="m-done">I am all done</label>
        <audio id="m-done" controls preload="metadata" src="matilda_i-am-all-done.mp3"></audio>
      </div>
    </section>

    <section>
      <h2>Friendly adult</h2>
      <div class="sample">
        <label for="fa-more">I want more</label>
        <audio id="fa-more" controls preload="metadata" src="friendly-adult_i-want-more.mp3"></audio>
      </div>
      <div class="sample">
        <label for="fa-help">Can I have help</label>
        <audio id="fa-help" controls preload="metadata" src="friendly-adult_can-i-have-help.mp3"></audio>
      </div>
      <div class="sample">
        <label for="fa-done">I am all done</label>
        <audio id="fa-done" controls preload="metadata" src="friendly-adult_i-am-all-done.mp3"></audio>
      </div>
    </section>

    <p class="note">
      Contact: <a href="mailto:mypalcommunications@gmail.com">mypalcommunications@gmail.com</a>
    </p>
  </main>
</body>
</html>
